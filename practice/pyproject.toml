[project]
name = "escape-practice"
version = "0.2.0"
description = "Free local Escape practice harness: invented boundaries, no capacity, no payout"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
test = ["pytest==8.3.5", "pytest-cov==5.0.0", "coverage==7.6.1"]

[project.scripts]
escape-practice = "escape_practice.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/escape_practice"]

[tool.hatch.build.targets.wheel.sources]
"src/escape_practice" = "escape_practice"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
